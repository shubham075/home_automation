# Pilot hub (x86 mini-PC). Set up once with:  bash hub/deploy/install.sh   (or see docs/07-pilot-hub.md)
# Published to the LAN: 443 (app, HTTPS), 80 (redirect + CA download), 8883 (boards, MQTT over TLS).
name: sw6-hub

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto/config-prod:/mosquitto/config:ro
      - ./data/mosquitto:/mosquitto/data
      - ./certs/ca.crt:/mosquitto/certs/ca.crt:ro
      - ./certs/server.crt:/mosquitto/certs/server.crt:ro
      - ./certs/server.key:/mosquitto/certs/server.key:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1883 && nc -z 127.0.0.1 8883"]
      interval: 15s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: hub/backend/Dockerfile
    image: sw6/backend:latest
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - ./data/db:/data/db
      - ./data/backups:/data/backups
    depends_on:
      mosquitto:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: hub/dashboard/Dockerfile
    image: sw6/web:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs/server.crt:/certs/server.crt:ro
      - ./certs/server.key:/certs/server.key:ro
      - ./certs/ca.crt:/certs-public/ca.crt:ro
    depends_on:
      - backend
