# DEV ONLY: plain MQTT, anonymous access, LAN bench use.
# Production (pilot): listener 8883 with TLS, allow_anonymous false,
# password_file + acl_file per docs/02-mqtt-spec.md section 5.
listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
