# Bench config: authenticated MQTT on plain 1883 (LAN only).
# Before the pilot: add a TLS listener on 8883 with the hub-local CA (docs/02-mqtt-spec.md).
per_listener_settings false
listener 1883
allow_anonymous false

# Dynamic Security: the backend creates per-device logins and ACL roles at runtime.
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
